name: V10 isolated candidate verification
on:
  push:
    branches: [feature/v10-elemental-td]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked dependencies without disabling TLS
        run: npm ci
      - name: Verify V10 mathematics and retained report/production behavior
        run: |
          mkdir -p artifacts/v10
          npm run test:v10 | tee artifacts/v10/engine.log
          python3 tests/fixtures/v10/test_scoring_v10.py | tee artifacts/v10/simple-reference.log
          npm run test:report | tee artifacts/v10/report.log
          npm run test:production | tee artifacts/v10/legacy-model.log
      - name: TypeScript and Vite Chrome109 target
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: v10-isolated-build-and-tests
          path: |
            source/dist/
            source/artifacts/v10/
